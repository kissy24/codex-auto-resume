name: macOS checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check security rules and run mock RPC tests
        run: python3 -I scripts/check.py
